# This workflow validates, deploys, and runs the specified bundle
# within a production target named "prod".
name: "Production deployment"

# Ensure that only a single job or workflow using the same concurrency group
# runs at a time.
concurrency: 1

# Trigger this workflow whenever a pull request is pushed to the repo's
# main branch.
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: "Deploy bundle"
    runs-on: ubuntu-latest

    steps:
      # Check out this repo, so that this workflow can access it.
      - uses: actions/checkout@v3

                  # Install Ruff
      - name: Install Ruff
        run: |
          pip install ruff

      # Run Ruff to check for issues in the code
      - name: Run Ruff
        run: |
         ruff check src/weather/weather_data_ingestion_function_unit_test.py
      - name: Run Ruff2
        run: |
         ruff check src/weather/weather_data_ingestion_function.py

      - name: Run Ruff3
        run: |
         ruff check src/data_process_function_unit_test.py

      - name: Run Ruff4
        run: |
         ruff check src/data_process_function.ipynb

      - name: Run Ruff5
        run: |
         ruff check src/scd_type_two_function_unit_test.py

      - name: Run Ruff6
        run: |
         ruff check src/scd_type_two_function.py


      # Download the Databricks CLI.
      # See https://github.com/databricks/setup-cli
      - uses: databricks/setup-cli@main

      # Deploy the bundle to the "prod" target as defined
      # in the bundle's settings file.
      - run: databricks bundle deploy
        working-directory: .
        env:
          DATABRICKS_TOKEN: ${{ secrets.SP_TOKEN }}
          DATABRICKS_BUNDLE_ENV: prod

  # Validate, deploy, and then run the bundle.
  pipeline_update:
    name: "Run pipeline update"
    runs-on: ubuntu-latest

    # Run the "deploy" job first.
    needs:
      - deploy

    steps:
      # Check out this repo, so that this workflow can access it.
      - uses: actions/checkout@v3

      # Use the downloaded Databricks CLI.
      - uses: databricks/setup-cli@main

      # Run the Databricks workflow named "my-job" as defined in the
      # bundle that was just deployed.
      - run: databricks bundle run -t prod dab_project_job
        working-directory: .
        env:
          DATABRICKS_TOKEN: ${{ secrets.SP_TOKEN }}
          DATABRICKS_BUNDLE_ENV: prod
      
    