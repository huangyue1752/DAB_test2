# The main job for dab_project.
resources:
  jobs:
    dab_project_job:
      name: dab_project_job

      schedule:
        # Run every day at 8:37 AM
        quartz_cron_expression: '44 37 8 * * ?'
        timezone_id: Europe/Amsterdam

      email_notifications:
        on_failure:
          - huangyue1752@gmail.com

      tasks:

        - task_key: scd_unittest
          job_cluster_key: job_cluster
          libraries:
            - maven:
                coordinates: com.microsoft.azure:azure-eventhubs-spark_2.12:2.3.22
            - pypi:
                package: azure-eventhub
            - pypi:
                package: beautifulsoup4
            - pypi:
                package: pandas
            - pypi:
                package: requests
          spark_python_task:
            python_file: ../src/scd_type_two_function_unit_test.py  

        - task_key: scd_typetwo_function
          job_cluster_key: job_cluster
          depends_on: 
            - task_key: notebook_task1
          libraries:
            - maven:
                coordinates: com.microsoft.azure:azure-eventhubs-spark_2.12:2.3.22
            - pypi:
                package: azure-eventhub
            - pypi:
                package: beautifulsoup4
            - pypi:
                package: pandas
            - pypi:
                package: requests
          spark_python_task:
            python_file: ../src/scd_type_two_function.py

        - task_key: spark_bronze_silver_generator_unittest
          job_cluster_key: job_cluster
          depends_on: 
            - task_key: notebook_task2
          libraries:
            - maven:
                coordinates: com.microsoft.azure:azure-eventhubs-spark_2.12:2.3.22
            - pypi:
                package: azure-eventhub
            - pypi:
                package: beautifulsoup4
            - pypi:
                package: pandas
            - pypi:
                package: requests
          spark_python_task:
            python_file: ../src/data_process_function_unit_test.py

        - task_key: spark_bronze_silver_generator
          job_cluster_key: job_cluster
          depends_on: 
            - task_key: notebook_task3
          libraries:
            - maven:
                coordinates: com.microsoft.azure:azure-eventhubs-spark_2.12:2.3.22
            - pypi:
                package: azure-eventhub
            - pypi:
                package: beautifulsoup4
            - pypi:
                package: pandas
            - pypi:
                package: requests
          notebook_task:
            notebook_path: ../src/data_process_function.ipynb

        - task_key: data_ingestion_unittest
          job_cluster_key: job_cluster
          depends_on: 
            - task_key: notebook_task2
          libraries:
            - maven:
                coordinates: com.microsoft.azure:azure-eventhubs-spark_2.12:2.3.22
            - pypi:
                package: azure-eventhub
            - pypi:
                package: beautifulsoup4
            - pypi:
                package: pandas
            - pypi:
                package: requests
          spark_python_task:
            python_file: ../src/weather/weather_data_ingestion_function_unit_test.py

        - task_key: data_ingestion_function
          job_cluster_key: job_cluster
          depends_on: 
            - task_key: notebook_task4
          libraries:
            - maven:
                coordinates: com.microsoft.azure:azure-eventhubs-spark_2.12:2.3.22
            - pypi:
                package: azure-eventhub
            - pypi:
                package: beautifulsoup4
            - pypi:
                package: pandas
            - pypi:
                package: requests
          spark_python_task:
            python_file: ../src/weather/weather_data_ingestion_function.py

        
      job_clusters:
        - job_cluster_key: job_cluster
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            autoscale:
                min_workers: 1
                max_workers: 1
            data_security_mode: "SHARED"
